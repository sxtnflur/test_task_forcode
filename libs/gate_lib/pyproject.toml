[tool.poetry]
name = "gate-lib"
version = "0.1.0"
description = "Local implementation of the gate protocol: models, statuses and FastAPI method builders"
authors = []
packages = [{ include = "gate_lib" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.115"
pydantic = "^2.7"
pydantic-settings = "^2.3"
structlog = ">=24.1"
httpx = ">=0.27,<0.28"
cds_client = { path = "../cds_client", develop = true }

[build-system]
requires = ["poetry-core>=1.8.1"]
build-backend = "poetry.core.masonry.api"
