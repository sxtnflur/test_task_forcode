[tool.poetry]
name = "utils"
version = "0.1.0"
description = "Local implementation of shared service utilities: logging, masking, HTTP client, FastAPI middleware"
authors = []
packages = [{ include = "utils" }]

[tool.poetry.dependencies]
python = "^3.12"
httpx = ">=0.27,<0.28"
starlette = ">=0.37"
structlog = ">=24.1"

[build-system]
requires = ["poetry-core>=1.8.1"]
build-backend = "poetry.core.masonry.api"
